name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup resources
        run: npm run setup

      - name: Build Windows installer
        run: npm run build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeuralUpscale-Windows
          path: release/*.exe
